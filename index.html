<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>購物欲望與必要性評估</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Chart.js 用於圓餅圖分析 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #334155;
        }
        .morandi-card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
        }
        .btn-primary {
            background-color: #58705f;
            color: white;
            transition: background-color 0.2s;
        }
        .btn-primary:hover {
            background-color: #485c50;
        }
    </style>
</head>
<body class="py-6 px-4 sm:px-6 lg:px-8 max-w-4xl mx-auto space-y-6">

    <!-- 頂部標題與設定按鈕 -->
    <div class="flex justify-between items-start">
        <div>
            <h1 class="text-xl sm:text-2xl font-bold text-slate-800 flex items-center gap-2">
                <span class="w-3 h-6 bg-[#58705f] rounded-full inline-block"></span>
                購物欲望與必要性評估
            </h1>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">釐清「想要」與「需要」，做出理性聰明的消費決策</p>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="openSettings()" class="flex items-center gap-1.5 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg transition">
                ⚙️ 偏好與時薪設定
            </button>
            <button onclick="resetAllData()" title="重置全部" class="text-slate-400 hover:text-slate-600 p-2">
                🔄
            </button>
        </div>
    </div>

    <!-- 預算與財務摘要區 -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="morandi-card p-4">
            <p class="text-xs text-slate-400">總預算上限</p>
            <p id="displayBudget" class="text-xl font-bold text-slate-700 mt-1">NT\$ 20,000</p>
        </div>
        <div class="morandi-card p-4">
            <p class="text-xs text-slate-400">目前總花費</p>
            <p id="displayTotalCost" class="text-xl font-bold text-slate-700 mt-1">NT\$ 0</p>
        </div>
    </div>

    <!-- 預算狀態與比例條 -->
    <div class="morandi-card p-4 space-y-3">
        <div id="budgetAlertBox" class="p-3 rounded-lg text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200 flex items-center gap-2">
            <span>✅</span> <span id="budgetText">預算控制良好，剩餘 NT\$ 20,000 可支配</span>
        </div>
        <div>
            <div class="flex justify-between text-xs text-slate-500 mb-1">
                <span>需要 vs 想要 比例</span>
                <span id="ratioText">必要 0% / 衝動 0%</span>
            </div>
            <div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden flex">
                <div id="barNeed" class="bg-[#58705f] h-full transition-all duration-300" style="width: 0%"></div>
                <div id="barWant" class="bg-[#d99b26] h-full transition-all duration-300" style="width: 0%"></div>
                <div id="barImpulse" class="bg-[#d96b6b] h-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>
        <!-- 圓餅圖容器 -->
        <div class="pt-2 flex justify-center">
            <div class="w-48 h-48">
                <canvas id="ratioChart"></canvas>
            </div>
        </div>
    </div>

    <!-- 新增與評估表單區 -->
    <div class="morandi-card p-5 space-y-4">
        <div class="flex justify-between items-center">
            <h2 class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
                <span>➕</span> 評估新物品
            </h2>
            <span class="text-xs text-slate-400">填寫評估可自動計算需要等級</span>
        </div>

        <form id="itemForm" class="space-y-4">
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">物品名稱 *</label>
                    <input type="text" id="itemName" required placeholder="例如：iPhone 17, 降噪耳機..." class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#58705f]">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">金額 (NT\$) *</label>
                        <input type="number" id="itemPrice" required min="0" placeholder="0" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#58705f]">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">數量</label>
                        <input type="number" id="itemQty" required min="1" value="1" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#58705f]">
                    </div>
                </div>
            </div>

            <!-- 理性必要性測驗 (下拉選單) -->
            <div class="border-t border-slate-100 pt-4 space-y-3">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-slate-700">理性必要性測驗</span>
                    <span id="liveBadge" class="text-xs px-2.5 py-1 rounded-full bg-slate-100 text-slate-600 font-medium">評估：等待填寫</span>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                    <div class="p-3 bg-slate-50 border border-slate-200 rounded-lg space-y-1">
                        <label class="font-medium text-slate-700 block">1. 沒有它生活/工作會嚴重受阻嗎？</label>
                        <select id="q1" class="w-full p-2 bg-white border border-slate-200 rounded text-slate-600 focus:outline-none">
                            <option value="3">是的，完全無法運作或替代 (高需要)</option>
                            <option value="2">有些影響，但不致於停擺</option>
                            <option value="1">完全沒有影響，只是想要</option>
                        </select>
                    </div>
                    <div class="p-3 bg-slate-50 border border-slate-200 rounded-lg space-y-1">
                        <label class="font-medium text-slate-700 block">2. 這個購買念頭維持多久了？</label>
                        <select id="q2" class="w-full p-2 bg-white border border-slate-200 rounded text-slate-600 focus:outline-none">
                            <option value="3">超過 30 天以上 (深思熟慮)</option>
                            <option value="2">大約 1 到 2 週</option>
                            <option value="1">剛看到不久，一時心動</option>
                        </select>
                    </div>
                    <div class="p-3 bg-slate-50 border border-slate-200 rounded-lg space-y-1">
                        <label class="font-medium text-slate-700 block">3. 目前是否有功能類似的替代品？</label>
                        <select id="q3" class="w-full p-2 bg-white border border-slate-200 rounded text-slate-600 focus:outline-none">
                            <option value="3">完全沒有替代品 (缺口大)</option>
                            <option value="2">有類似的，但耗損或效能差</option>
                            <option value="1">手邊有好幾個完全一樣功能的物品</option>
                        </select>
                    </div>
                    <div class="p-3 bg-slate-50 border border-slate-200 rounded-lg space-y-1">
                        <label class="font-medium text-slate-700 block">4. 預估購買后的使用頻率？</label>
                        <select id="q4" class="w-full p-2 bg-white border border-slate-200 rounded text-slate-600 focus:outline-none">
                            <option value="3">每天使用 / 頻繁高廣度</option>
                            <option value="2">每週會用到幾次</option>
                            <option value="1">偶爾用一次或不確定</option>
                        </select>
                    </div>
                </div>
            </div>

            <button type="submit" class="w-full py-2.5 px-4 btn-primary rounded-lg font-medium text-sm shadow-sm">
                + 加入評估清單
            </button>
        </form>
    </div>

    <!-- 評估物品清單區 -->
    <div class="morandi-card p-5 space-y-4">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
            <h2 id="listTitle" class="text-sm font-bold text-slate-700">📋 評估物品清單 (0)</h2>
            <!-- 分類篩選標籤 -->
            <div class="flex gap-1 bg-slate-100 p-1 rounded-lg text-xs">
                <button onclick="setFilter('all')" id="filter-all" class="px-3 py-1 rounded-md bg-white shadow-sm font-medium text-slate-700">全部</button>
                <button onclick="setFilter('need')" id="filter-need" class="px-3 py-1 rounded-md text-slate-500 hover:text-slate-700">極度需要</button>
                <button onclick="setFilter('want')" id="filter-want" class="px-3 py-1 rounded-md text-slate-500 hover:text-slate-700">實用想要</button>
                <button onclick="setFilter('impulse')" id="filter-impulse" class="px-3 py-1 rounded-md text-slate-500 hover:text-slate-700">一時衝動</button>
            </div>
        </div>

        <div id="itemList" class="space-y-3">
            <p id="emptyMessage" class="text-center text-xs text-slate-400 py-8">目前沒有評估紀錄，請在上方新增想買的物品！</p>
        </div>
    </div>

    <!-- 理性消費冷卻洞察卡片 -->
    <div class="bg-slate-900 text-slate-100 p-5 rounded-2xl space-y-4 shadow-lg">
        <h3 class="text-sm font-bold flex items-center gap-2 text-amber-300">
            <span>💡</span> 理性消費冷卻洞察
        </h3>
        <div class="space-y-3 text-xs">
            <div id="workHourInsight" class="bg-slate-800 p-3.5 rounded-xl border border-slate-700 text-slate-300">
                ⏳ 衝動消費代價換算：目前沒有衝動消費項目。
            </div>
            <div id="behavioralInsight" class="bg-[#203a2f] p-3.5 rounded-xl border border-[#2f5544] text-emerald-200">
                👍 理性控制良好：持續保持這份購物清醒！
            </div>
        </div>
    </div>

    <!-- 設定 Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden justify-center items-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full space-y-4 shadow-xl">
            <h3 class="text-base font-bold text-slate-800">⚙️ 偏好與時薪設定</h3>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-medium text-slate-600 mb-1">總預算上限 (NT\$)</label>
                    <input type="number" id="settingBudget" class="w-full p-2.5 border rounded-lg">
                </div>
                <div>
                    <label class="block font-medium text-slate-600 mb-1">估算時薪 (NT\$ / 小時) - 用於工時換算</label>
                    <input type="number" id="settingHourlyWage" class="w-full p-2.5 border rounded-lg" value="180">
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeSettings()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-xs">取消</button>
                <button onclick="saveSettings()" class="px-4 py-2 btn-primary rounded-lg text-xs font-medium">儲存設定</button>
            </div>
        </div>
    </div>

    <script>
        // 資料狀態
        let items = JSON.parse(localStorage.getItem('shopping_items_v2')) || [];
        let budget = parseFloat(localStorage.getItem('shopping_budget_v2')) || 20000;
        let hourlyWage = parseFloat(localStorage.getItem('shopping_wage_v2')) || 180;
        let currentFilter = 'all';
        let chartInstance = null;

        // 初始化
        document.getElementById('settingBudget').value = budget;
        document.getElementById('settingHourlyWage').value = hourlyWage;
        updateLiveBadge();
        render();

        // 即時計算評估徽章
        ['q1', 'q2', 'q3', 'q4'].forEach(id => {
            document.getElementById(id).addEventListener('change', updateLiveBadge);
        });

        function updateLiveBadge() {
            const score = ['q1', 'q2', 'q3', 'q4'].reduce((sum, id) => sum + parseInt(document.getElementById(id).value), 0);
            const badge = document.getElementById('liveBadge');
            if (score >= 10) {
                badge.textContent = '評估：【極度需要】';
                badge.className = 'text-xs px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 font-medium';
            } else if (score >= 7) {
                badge.textContent = '評估：【實用想要】';
                badge.className = 'text-xs px-2.5 py-1 rounded-full bg-amber-100 text-amber-800 font-medium';
            } else {
                badge.textContent = '評估：【一時衝動】';
                badge.className = 'text-xs px-2.5 py-1 rounded-full bg-rose-100 text-rose-800 font-medium';
            }
        }

        // 表單送出
        document.getElementById('itemForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('itemName').value.trim();
            const price = parseFloat(document.getElementById('itemPrice').value);
            const qty = parseInt(document.getElementById('itemQty').value);
            
            const q1 = parseInt(document.getElementById('q1').value);
            const q2 = parseInt(document.getElementById('q2').value);
            const q3 = parseInt(document.getElementById('q3').value);
            const q4 = parseInt(document.getElementById('q4').value);
            const score = q1 + q2 + q3 + q4;

            let type = 'need';
            let badgeText = '🛡️ 極度需要';
            let badgeClass = 'bg-emerald-100 text-emerald-800';

            if (score >= 10) {
                type = 'need';
                badgeText = '🛡️ 極度需要';
                badgeClass = 'bg-emerald-100 text-emerald-800';
            } else if (score >= 7) {
                type = 'want';
                badgeText = '⭐ 實用想要';
                badgeClass = 'bg-amber-100 text-amber-800';
            } else {
                type = 'impulse';
                badgeText = '🔥 一時衝動';
                badgeClass = 'bg-rose-100 text-rose-800';
            }

            const newItem = {
                id: Date.now(),
                name, price, qty, total: price * qty,
                type, badgeText, badgeClass, score
            };

            items.push(newItem);
            saveAndRender();
            e.target.reset();
            document.getElementById('itemQty').value = '1';
            updateLiveBadge();
        });

        function deleteItem(id) {
            items = items.filter(i => i.id !== id);
            saveAndRender();
        }

        function setFilter(filter) {
            currentFilter = filter;
            ['all', 'need', 'want', 'impulse'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (f === filter) {
                    btn.className = 'px-3 py-1 rounded-md bg-white shadow-sm font-medium text-slate-700';
                } else {
                    btn.className = 'px-3 py-1 rounded-md text-slate-500 hover:text-slate-700';
                }
            });
            renderList();
        }

        function saveAndRender() {
            localStorage.setItem('shopping_items_v2', JSON.stringify(items));
            render();
        }

        function render() {
            document.getElementById('displayBudget').textContent = `NT$ ${budget.toLocaleString()}`;
            const totalCost = items.reduce((sum, i) => sum + i.total, 0);
            document.getElementById('displayTotalCost').textContent = `NT$ ${totalCost.toLocaleString()}`;

            // 預算警示與進度條
            const remaining = budget - totalCost;
            const alertBox = document.getElementById('budgetAlertBox');
            if (remaining < 0) {
                alertBox.className = 'p-3 rounded-lg text-xs font-medium bg-rose-50 text-rose-700 border border-rose-200 flex items-center gap-2';
                alertBox.innerHTML = `<span>⚠️</span> <span>預算已超支！超出 NT$ ${Math.abs(remaining).toLocaleString()}</span>`;
            } else {
                alertBox.className = 'p-3 rounded-lg text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200 flex items-center gap-2';
                alertBox.innerHTML = `<span>✅</span> <span>預算控制良好，剩餘 NT$ ${remaining.toLocaleString()} 可支配</span>`;
            }

            // 計算分類比例
            const needTotal = items.filter(i => i.type === 'need').reduce((s, i) => s + i.total, 0);
            const wantTotal = items.filter(i => i.type === 'want').reduce((s, i) => s + i.total, 0);
            const impulseTotal = items.filter(i => i.type === 'impulse').reduce((s, i) => s + i.total, 0);
            const grandTotal = needTotal + wantTotal + impulseTotal || 1;

            const needPct = Math.round((needTotal / grandTotal) * 100);
            const wantPct = Math.round((wantTotal / grandTotal) * 100);
            const impulsePct = 100 - needPct - wantPct;

            document.getElementById('barNeed').style.width = `${needPct}%`;
            document.getElementById('barWant').style.width = `${wantPct}%`;
            document.getElementById('barImpulse').style.width = `${impulsePct}%`;
            document.getElementById('ratioText').textContent = `必要 ${needPct}% / 衝動 ${impulsePct}%`;

            renderChart(needTotal, wantTotal, impulseTotal);
            renderList();
            renderInsights(impulseTotal, needTotal, wantTotal);
        }

        function renderList() {
            const listDiv = document.getElementById('itemList');
            const emptyMsg = document.getElementById('emptyMessage');
            
            const filtered = items.filter(i => {
                if (currentFilter === 'all') return true;
                return i.type === currentFilter;
            });

            document.getElementById('listTitle').textContent = `📋 評估物品清單 (${filtered.length})`;
            listDiv.innerHTML = '';

            if (filtered.length === 0) {
                listDiv.appendChild(emptyMsg);
                emptyMsg.style.display = 'block';
                return;
            }
            emptyMsg.style.display = 'none';

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'p-4 bg-slate-50 border border-slate-200 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 text-sm';
                card.innerHTML = `
                    <div class="space-y-1">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-slate-800">${escapeHtml(item.name)}</span>
                            <span class="text-xs px-2 py-0.5 rounded-full font-medium ${item.badgeClass}">${item.badgeText}</span>
                        </div>
                        <p class="text-xs text-slate-500">單價：NT$ ${item.price.toLocaleString()} ｜ 數量：${item.qty}</p>
                    </div>
                    <div class="flex items-center justify-between sm:justify-end w-full sm:w-auto gap-4 border-t sm:border-t-0 pt-2 sm:pt-0 border-slate-200">
                        <div class="text-right">
                            <p class="text-[10px] text-slate-400">小計</p>
                            <p class="font-bold text-slate-800">NT$ ${item.total.toLocaleString()}</p>
                        </div>
                        <button onclick="deleteItem(${item.id})" class="text-slate-400 hover:text-rose-600 p-1">🗑️</button>
                    </div>
                `;
                listDiv.appendChild(card);
            });
        }

        function renderChart(need, want, impulse) {
            const ctx = document.getElementById('ratioChart').getContext('2d');
            if (chartInstance) {
                chartInstance.destroy();
            }
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['極度需要', '實用想要', '一時衝動'],
                    datasets: [{
                        data: [need, want, impulse],
                        backgroundColor: ['#58705f', '#d99b26', '#d96b6b'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } }
                }
            });
        }

        function renderInsights(impulseTotal, needTotal, wantTotal) {
            const workInsight = document.getElementById('workHourInsight');
            const behaviorInsight = document.getElementById('behavioralInsight');

            if (impulseTotal > 0) {
                const hours = (impulseTotal / hourlyWage).toFixed(1);
                const days = (hours / 8).toFixed(1);
                workInsight.innerHTML = `⏳ <b>衝動消費代價換算</b>：清單中的「一時衝動」花費金額為 <b>NT$ ${impulseTotal.toLocaleString()}</b>。這相當於你需要辛勤工作 <b>${hours} 小時 (${days} 天)</b> 才能賺回！`;
            } else {
                workInsight.innerHTML = `⏳ <b>衝動消費代價換算</b>：目前清單中沒有「一時衝動」的物品，太棒了！`;
            }

            if (needTotal >= (needTotal + wantTotal + impulseTotal) * 0.5) {
                behaviorInsight.innerHTML = `👍 <b>理性控制良好</b>：大部分預算皆花在實用與需要物品上，繼續保持這份購物清醒！`;
            } else {
                behaviorInsight.innerHTML = `💡 <b>消費提醒</b>：「想要」或「衝動」佔比較高，下手前建議再考慮 3 天喔！`;
            }
        }

        // 設定 Modal 控制
        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
        function saveSettings() {
            budget = parseFloat(document.getElementById('settingBudget').value) || 20000;
            hourlyWage = parseFloat(document.getElementById('settingHourlyWage').value) || 180;
            localStorage.setItem('shopping_budget_v2', budget);
            localStorage.setItem('shopping_wage_v2', hourlyWage);
            closeSettings();
            render();
        }

        function resetAllData() {
            if (confirm('確定要清空所有紀錄嗎？')) {
                items = [];
                saveAndRender();
            }
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
